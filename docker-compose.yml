# ==============================================================================
# Synapse Platform — Docker Compose (Local Development)
# ==============================================================================
#
# Usage:
#   docker compose up        — Start all services (attached)
#   docker compose up -d     — Start all services (detached)
#   docker compose down      — Stop and remove containers
#   docker compose down -v   — Stop, remove containers AND volumes
#   docker compose logs -f   — Follow logs from all services
#   docker compose ps        — Show running service status
#
# Reference: Document 23 (TS-06 §6.4) — Docker containerization standards.
# Reference: Document 25 (IR-04 §4.6) — Docker Compose in dev environment.
# Reference: Document 25 (IR-10 §10.6) — Local development infrastructure.
# ==============================================================================


# ── Services ─────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: synapse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override database/redis URLs to use Docker service hostnames.
      DATABASE_URL: "postgresql+asyncpg://synapse:synapse_dev@postgres:5432/synapse"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      # Bind-mount app source for hot-reload during development.
      - ./backend/app:/app/app
    networks:
      - synapse-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_dev
      POSTGRES_DB: synapse
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - synapse_redisdata:/data
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5


# ── Networks ─────────────────────────────────────────────────────────────

networks:
  synapse-network:
    driver: bridge


# ── Volumes ──────────────────────────────────────────────────────────────

volumes:
  synapse_pgdata:
    driver: local
  synapse_redisdata:
    driver: local
